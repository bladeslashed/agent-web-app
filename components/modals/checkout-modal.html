<!-- MODAL: FINALISASI & CHECKOUT TRANSAKSI (PILIH TANGGAL & LOKASI) -->
<div id="checkout-modal" class="bottom-sheet-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="checkout-modal-title">
  <div class="bottom-sheet-backdrop" id="close-checkout-modal-backdrop"></div>
  <div class="bottom-sheet-container checkout-dialog-container">
    <div class="sheet-handle-bar"><span class="sheet-handle"></span></div>

    <div class="sheet-header">
      <div class="sheet-header-title-wrap">
        <div class="icon-circle bg-brand">
          <i data-lucide="receipt"></i>
        </div>
        <div>
          <h3 id="checkout-modal-title" class="sheet-title">Selesaikan Belanja</h3>
          <p class="sheet-subtitle" id="checkout-modal-subtitle">Tentukan tanggal dan lokasi supermarket untuk riwayat belanja</p>
        </div>
      </div>
      <button id="close-checkout-modal-btn" class="icon-btn-close" aria-label="Tutup dialog checkout">
        <i data-lucide="x"></i>
      </button>
    </div>

    <div class="sheet-body">
      <!-- Ringkasan Anggaran Keranjang -->
      <div class="checkout-modal-summary-banner mb-3">
        <div class="summary-line-item">
          <span class="label">Total Pengeluaran:</span>
          <strong id="checkout-modal-total-display" class="highlight-val">Rp 0</strong>
        </div>
        <div class="summary-line-sub">
          <span id="checkout-modal-items-count">0 barang di troli</span>
          <span id="checkout-modal-status-badge" class="badge safe">Dompet Aman</span>
        </div>
      </div>

      <!-- Form Inputs: Title, Date, Location -->
      <form id="checkout-form" class="checkout-form-grid" onsubmit="return false;">
        <!-- 1. Nama / Judul Transaksi -->
        <div class="form-group mb-3">
          <label for="checkout-trip-title" class="form-label">
            <i data-lucide="tag" class="label-icon"></i>
            <span>Nama / Judul Catatan Belanja</span>
          </label>
          <input type="text" id="checkout-trip-title" class="form-input" placeholder="Contoh: Belanja Bulanan Lotte Mart">
        </div>

        <!-- 2. Tanggal & Waktu Transaksi -->
        <div class="form-group mb-3">
          <label for="checkout-trip-date" class="form-label">
            <i data-lucide="calendar" class="label-icon"></i>
            <span>Tanggal &amp; Waktu Transaksi</span>
          </label>
          <input type="datetime-local" id="checkout-trip-date" class="form-input" required>
          <span class="form-hint text-xs">Pilih tanggal dan jam saat transaksi ini dilakukan</span>
        </div>

        <!-- 3. Lokasi Supermarket / Toko -->
        <div class="form-group mb-3">
          <div class="label-with-action">
            <label for="checkout-location-select" class="form-label mb-0">
              <i data-lucide="map-pin" class="label-icon"></i>
              <span>Lokasi Supermarket / Toko</span>
            </label>
            <button type="button" id="btn-toggle-custom-location-checkout" class="btn-text-accent text-xs">
              <i data-lucide="plus-circle"></i> <span>Tambah Lokasi</span>
            </button>
          </div>

          <div class="location-select-wrap mt-1">
            <select id="checkout-location-select" class="form-select">
              <!-- Populated dynamically via JS -->
            </select>
          </div>

          <!-- Customizable Option: Box to Add New Location -->
          <div id="checkout-custom-location-box" class="custom-location-box hidden mt-2">
            <div class="input-with-action">
              <input type="text" id="checkout-custom-location-input" class="form-input" placeholder="Contoh: Lotte Mart Grocery - Puri Indah">
              <button type="button" id="btn-save-custom-location-checkout" class="btn-sm btn-accent">
                <i data-lucide="check"></i> <span>Gunakan</span>
              </button>
            </div>
            <span class="form-hint text-xs mt-1">Lokasi baru akan otomatis tersimpan ke pilihan supermarket Anda</span>
          </div>
        </div>

        <!-- Modal Actions Footer -->
        <div class="modal-actions-row mt-4">
          <button type="button" id="btn-cancel-checkout" class="btn-secondary flex-1">
            Batal
          </button>
          <button type="button" id="btn-confirm-checkout" class="btn-primary flex-1">
            <i data-lucide="check-circle-2"></i> <span>Simpan ke Riwayat</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
