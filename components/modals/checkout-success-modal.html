<!-- Supermarket Checkout Success & Animated Cart Popup Modal -->
<div id="checkout-success-modal" class="bottom-sheet-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="checkout-success-heading">
  <div class="bottom-sheet-backdrop" id="close-checkout-success-backdrop"></div>
  
  <div class="bottom-sheet-container checkout-success-sheet">
    <div class="sheet-handle-bar">
      <div class="sheet-handle"></div>
    </div>

    <div class="sheet-header">
      <div>
        <div class="success-badge-pill">
          <i data-lucide="party-popper"></i>
          <span id="checkout-success-pill-text">Transaksi Selesai</span>
        </div>
        <h3 id="checkout-success-heading" class="sheet-title mt-1">Belanja Berhasil Disimpan!</h3>
        <p id="checkout-success-sub" class="sheet-subtitle">Keranjang belanja telah dipindahkan ke riwayat</p>
      </div>
      <button id="close-checkout-success-btn" class="icon-btn" title="Tutup" aria-label="Tutup">
        <i data-lucide="x"></i>
      </button>
    </div>

    <!-- Animated Shopping Cart Stage (Strictly Contained within Popup Bounds) -->
    <div class="cart-stage-wrapper">
      <div class="cart-stage" id="cart-animation-stage">
        
        <!-- Background Elements: Glowing Aura, Speed Streaks & Confetti -->
        <div class="stage-aura"></div>
        <!-- Runway Floor & Motion Lines -->
        <div class="cart-runway">
          <div class="runway-line"></div>
          <div class="speed-streaks">
            <span class="streak s1"></span>
            <span class="streak s2"></span>
            <span class="streak s3"></span>
            <span class="streak s4"></span>
          </div>
        </div>

        <!-- Replay Cart Animation Button -->
        <button id="replay-cart-animation-btn" class="replay-btn" type="button" title="Putar Ulang Animasi Keranjang" aria-label="Putar Ulang">
          <i data-lucide="rotate-ccw"></i>
        </button>

        <!-- THE ANIMATED SHOPPING CART + PUSHING HANDS (SVG) -->
        <!-- Animates from Left (-150%) across screen to Right (+150%) -->
        <div class="cart-pusher-unit" id="cart-pusher-unit">
          <svg class="cart-svg-illustration" viewBox="0 0 340 180" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <!-- Metallic Gradients -->
              <linearGradient id="cartMetal" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#94a3b8" />
                <stop offset="50%" stop-color="#cbd5e1" />
                <stop offset="100%" stop-color="#64748b" />
              </linearGradient>
              <linearGradient id="cartHandle" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ef4444" />
                <stop offset="100%" stop-color="#991b1b" />
              </linearGradient>
              <linearGradient id="baguetteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#fde047" />
                <stop offset="50%" stop-color="#d97706" />
                <stop offset="100%" stop-color="#92400e" />
              </linearGradient>
              <linearGradient id="milkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#60a5fa" />
                <stop offset="100%" stop-color="#2563eb" />
              </linearGradient>
              <linearGradient id="cerealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f43f5e" />
                <stop offset="100%" stop-color="#be123c" />
              </linearGradient>
              <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ef4444" />
                <stop offset="100%" stop-color="#b91c1c" />
              </linearGradient>
              <linearGradient id="sleeveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#3b82f6" />
                <stop offset="100%" stop-color="#1d4ed8" />
              </linearGradient>
              <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#fed7aa" />
                <stop offset="100%" stop-color="#fba866" />
              </linearGradient>
              <filter id="cartGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="rgba(59, 130, 246, 0.45)" />
              </filter>
            </defs>

            <!-- GROCERIES INSIDE CART (Anchored firmly into wire basket, not floating) -->
            <g class="groceries-group" transform="translate(0, 24)">
              <!-- Crispy French Baguette Sticking Out to the Left/Up -->
              <g transform="rotate(-25 150 40)">
                <rect x="135" y="10" width="22" height="75" rx="11" fill="url(#baguetteGrad)" stroke="#78350f" stroke-width="1.5" />
                <!-- Baguette crust score slits -->
                <line x1="140" y1="22" x2="152" y2="28" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round" />
                <line x1="140" y1="36" x2="152" y2="42" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round" />
                <line x1="140" y1="50" x2="152" y2="56" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round" />
                <line x1="140" y1="64" x2="152" y2="70" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round" />
              </g>

              <!-- Fresh Supermarket Greens / Celery / Lettuce -->
              <path d="M165,65 Q158,25 175,18 Q192,25 185,65 Z" fill="#22c55e" stroke="#15803d" stroke-width="1.5" />
              <path d="M178,65 Q175,32 195,28 Q208,38 198,65 Z" fill="#4ade80" stroke="#16a34a" stroke-width="1.5" />
              <path d="M155,65 Q145,38 160,32 Q170,42 165,65 Z" fill="#86efac" stroke="#16a34a" stroke-width="1" />

              <!-- Cereal / Oats Box resting in basket -->
              <rect x="195" y="38" width="34" height="52" rx="4" fill="url(#cerealGrad)" stroke="#9f1239" stroke-width="1.5" />
              <circle cx="212" cy="54" r="8" fill="#fbbf24" />
              <path d="M212,48 L214,53 L219,53 L215,56 L217,61 L212,58 L207,61 L209,56 L205,53 L210,53 Z" fill="#ffffff" />
              <rect x="201" y="68" width="22" height="4" rx="2" fill="#ffffff" opacity="0.8" />
              <rect x="201" y="76" width="16" height="4" rx="2" fill="#ffffff" opacity="0.8" />

              <!-- Fresh Milk Carton resting in basket -->
              <polygon points="172,48 184,38 198,48 198,92 172,92" fill="url(#milkGrad)" stroke="#1e40af" stroke-width="1.5" />
              <polygon points="172,48 184,38 198,48 186,52" fill="#93c5fd" />
              <rect x="176" y="58" width="16" height="12" rx="2" fill="#ffffff" opacity="0.9" />
              <text x="184" y="67" font-size="7" font-weight="bold" fill="#1e40af" text-anchor="middle" font-family="sans-serif">MILK</text>

              <!-- Fresh Orange Carrot with Greens -->
              <g transform="rotate(35 220 70)">
                <polygon points="216,40 226,40 221,75" fill="#f97316" stroke="#c2410c" stroke-width="1.5" />
                <line x1="218" y1="48" x2="223" y2="48" stroke="#ea580c" stroke-width="1" />
                <line x1="219" y1="58" x2="223" y2="58" stroke="#ea580c" stroke-width="1" />
                <!-- Carrot Leafy Tops -->
                <path d="M221,40 Q215,28 212,22 M221,40 Q221,25 221,20 M221,40 Q227,28 230,22" stroke="#16a34a" stroke-width="2" stroke-linecap="round" fill="none" />
              </g>

              <!-- Juicy Red Apple nestled on basket floor -->
              <circle cx="160" cy="80" r="14" fill="url(#appleGrad)" stroke="#991b1b" stroke-width="1.5" />
              <path d="M160,66 C163,62 167,61 169,63" stroke="#78350f" stroke-width="2" stroke-linecap="round" fill="none" />
              <ellipse cx="168" cy="63" rx="4" ry="2" transform="rotate(-30 168 63)" fill="#22c55e" />
            </g>

            <!-- SHOPPING CART FRAME & WIRE BASKET -->
            <g class="cart-frame" filter="url(#cartGlow)">
              <!-- Lower Chassis Frame Bar -->
              <path d="M125,138 L255,138 L262,118 L142,118 Z" fill="#475569" stroke="url(#cartMetal)" stroke-width="2.5" stroke-linejoin="round" />
              
              <!-- Diagonal Support Strut to Basket -->
              <line x1="140" y1="120" x2="165" y2="65" stroke="url(#cartMetal)" stroke-width="4" stroke-linecap="round" />
              <line x1="245" y1="120" x2="240" y2="70" stroke="url(#cartMetal)" stroke-width="4" stroke-linecap="round" />

              <!-- Wire Basket Outline -->
              <polygon points="135,62 258,62 248,118 152,118" fill="rgba(241, 245, 249, 0.15)" stroke="url(#cartMetal)" stroke-width="3.5" stroke-linejoin="round" />
              
              <!-- Basket Front Rounded Bumper -->
              <path d="M258,62 Q264,62 264,68 L253,116 Q250,118 246,118" fill="none" stroke="url(#cartMetal)" stroke-width="3" />

              <!-- Basket Horizontal Grid Lines -->
              <line x1="139" y1="76" x2="255" y2="76" stroke="url(#cartMetal)" stroke-width="1.8" opacity="0.85" />
              <line x1="143" y1="90" x2="252" y2="90" stroke="url(#cartMetal)" stroke-width="1.8" opacity="0.85" />
              <line x1="148" y1="104" x2="250" y2="104" stroke="url(#cartMetal)" stroke-width="1.8" opacity="0.85" />

              <!-- Basket Vertical Grid Lines -->
              <line x1="156" y1="63" x2="162" y2="117" stroke="url(#cartMetal)" stroke-width="1.8" opacity="0.8" />
              <line x1="174" y1="63" x2="178" y2="117" stroke="url(#cartMetal)" stroke-width="1.8" opacity="0.8" />
              <line x1="192" y1="63" x2="194" y2="117" stroke="url(#cartMetal)" stroke-width="1.8" opacity="0.8" />
              <line x1="210" y1="63" x2="210" y2="117" stroke="url(#cartMetal)" stroke-width="1.8" opacity="0.8" />
              <line x1="228" y1="63" x2="226" y2="117" stroke="url(#cartMetal)" stroke-width="1.8" opacity="0.8" />
              <line x1="244" y1="63" x2="240" y2="117" stroke="url(#cartMetal)" stroke-width="1.8" opacity="0.8" />

              <!-- Cart Rear Upright Post to Handle -->
              <line x1="135" y1="62" x2="112" y2="44" stroke="url(#cartMetal)" stroke-width="4.5" stroke-linecap="round" />

              <!-- Cart Red Grip Push Handle -->
              <circle cx="112" cy="44" r="7" fill="url(#cartHandle)" stroke="#7f1d1d" stroke-width="1.5" />
              <rect x="106" y="38" width="12" height="12" rx="4" fill="url(#cartHandle)" stroke="#7f1d1d" stroke-width="1" />
            </g>

            <!-- SHOPPER'S ARMS & HANDS PUSHING FROM THE LEFT -->
            <g class="shopper-pusher">
              <!-- Upper Arm / Sleeve -->
              <path d="M10,25 C45,28 70,35 102,42" fill="none" stroke="url(#sleeveGrad)" stroke-width="14" stroke-linecap="round" />
              <!-- Forearm Skin -->
              <path d="M85,38 L108,44" fill="none" stroke="url(#skinGrad)" stroke-width="10" stroke-linecap="round" />
              <!-- Hand Gripping Handle -->
              <ellipse cx="111" cy="44" rx="7" ry="6" fill="url(#skinGrad)" stroke="#c2410c" stroke-width="1" />
              <!-- Thumb wrapped over bar -->
              <path d="M108,41 Q113,38 116,42" fill="none" stroke="url(#skinGrad)" stroke-width="3" stroke-linecap="round" />

              <!-- Second Arm (Background Depth) -->
              <path d="M5,15 C40,18 65,26 98,34" fill="none" stroke="#1e3a8a" stroke-width="11" stroke-linecap="round" opacity="0.7" />
              <ellipse cx="104" cy="36" rx="6" ry="5" fill="#fba866" opacity="0.8" />
            </g>

            <!-- SPINNING WHEELS (Fixed translation on mount, animated spin on wheel-spinner) -->
            <!-- Rear Wheel Group -->
            <g class="wheel-mount rear-mount" transform="translate(142, 148)">
              <!-- Stationary Chassis Bracket -->
              <path d="M-3,-10 L3,-10 L2,0 L-2,0 Z" fill="#475569" />
              <!-- Rotating Wheel Assembly -->
              <g class="wheel-spinner">
                <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#334155" stroke-width="2.5" />
                <circle cx="0" cy="0" r="9.5" fill="#1e293b" stroke="#475569" stroke-width="1" />
                <!-- 6 Spokes with Sky Blue Accent for High Contrast Spinning Visibility -->
                <line x1="-9" y1="0" x2="9" y2="0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
                <line x1="-4.5" y1="-7.8" x2="4.5" y2="7.8" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
                <line x1="-4.5" y1="7.8" x2="4.5" y2="-7.8" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
                <circle cx="0" cy="0" r="3.5" fill="#f8fafc" stroke="#0284c7" stroke-width="1" />
                <circle cx="6" cy="0" r="1.5" fill="#facc15" />
              </g>
            </g>

            <!-- Front Wheel Group -->
            <g class="wheel-mount front-mount" transform="translate(244, 148)">
              <!-- Stationary Chassis Bracket -->
              <path d="M-3,-10 L3,-10 L2,0 L-2,0 Z" fill="#475569" />
              <!-- Rotating Wheel Assembly -->
              <g class="wheel-spinner">
                <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#334155" stroke-width="2.5" />
                <circle cx="0" cy="0" r="9.5" fill="#1e293b" stroke="#475569" stroke-width="1" />
                <!-- 6 Spokes with Sky Blue Accent for High Contrast Spinning Visibility -->
                <line x1="-9" y1="0" x2="9" y2="0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
                <line x1="-4.5" y1="-7.8" x2="4.5" y2="7.8" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
                <line x1="-4.5" y1="7.8" x2="4.5" y2="-7.8" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
                <circle cx="0" cy="0" r="3.5" fill="#f8fafc" stroke="#0284c7" stroke-width="1" />
                <circle cx="6" cy="0" r="1.5" fill="#facc15" />
              </g>
            </g>
          </svg>
        </div>
      </div>
    </div>

    <!-- Purchase Summary Card -->
    <div class="checkout-success-summary-card mt-3">
      <div class="summary-top-row">
        <div>
          <span class="summary-label" id="checkout-summary-trip-label">Nama Transaksi</span>
          <strong id="checkout-success-trip-title" class="summary-title">Belanja Bulan Ini</strong>
        </div>
        <span id="checkout-success-status-tag" class="history-status-tag safe">Dompet Aman</span>
      </div>

      <div class="summary-details-grid mt-2">
        <div class="stat-box">
          <span class="stat-label" id="checkout-summary-total-label">Total Belanja</span>
          <span id="checkout-success-total-val" class="stat-val text-brand">Rp 0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label" id="checkout-summary-items-label">Jumlah Barang</span>
          <span id="checkout-success-items-count" class="stat-val">0 Item</span>
        </div>
      </div>

      <!-- Comparator Insight Pill -->
      <div id="checkout-success-comp-pill" class="success-comp-pill comp-none mt-2">
        <span class="comp-icon">-</span>
        <span id="checkout-success-comp-text">Belanja pertama tercatat! Riwayat pembanding aktif di transaksi berikutnya.</span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="checkout-success-actions mt-3">
      <button id="btn-view-history-after-checkout" class="btn-primary w-full mb-2" type="button">
        <i data-lucide="receipt"></i>
        <span id="label-view-history-checkout">Lihat Riwayat Belanja</span>
      </button>
      <button id="btn-close-checkout-success" class="btn-secondary w-full" type="button">
        <i data-lucide="check"></i>
        <span id="label-close-checkout-success">Selesai & Tutup</span>
      </button>
    </div>

  </div>
</div>
